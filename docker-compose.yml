version: '3.8'

services:
  releasesentry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: releasesentry-ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY}
      - AGENTIA_FORCE_DEMO=${AGENTIA_FORCE_DEMO:-true}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
